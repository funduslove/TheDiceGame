<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TheDiceGame</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #d8ccb4;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #3a3020;
      overflow: hidden;
    }
    #app {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    canvas {
      border: 3px solid #a89878;
      border-radius: 12px;
      background: #e8dcc8;
      box-shadow: 0 8px 32px rgba(0,0,0,0.15);
    }
    #hud {
      display: flex;
      gap: 24px;
      font-size: 14px;
      opacity: 0.7;
    }
    #hud span { color: #2a8866; font-weight: 600; }
    #level-name {
      font-size: 22px;
      font-weight: 700;
      color: #5a4030;
    }
    #hint {
      font-size: 14px;
      color: #7a6040;
      max-width: 700px;
      text-align: center;
      font-style: italic;
    }
    #win-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
      z-index: 100;
    }
    #win-overlay.show { display: flex; }
    #win-message {
      background: #f5efe4;
      border: 3px solid #88c878;
      border-radius: 16px;
      padding: 36px 52px;
      text-align: center;
      box-shadow: 0 12px 40px rgba(0,0,0,0.25);
    }
    #win-message h2 { color: #44aa33; margin-bottom: 12px; font-size: 28px; }
    #win-message p { color: #5a4030; }
  </style>
</head>
<body>
  <div id="app">
    <div id="level-name"></div>
    <canvas id="game-canvas" width="960" height="700"></canvas>
    <div id="hint"></div>
    <div id="hud">
      <div>Turns: <span id="turn-count">0</span></div>
      <div>Undo: <span>Z</span> | Redo: <span>Y</span> | Reset: <span>R</span></div>
    </div>
  </div>
  <div id="win-overlay">
    <div id="win-message">
      <h2>Level Complete!</h2>
      <p>Press <strong>Enter</strong> or <strong>Space</strong> for next level</p>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
